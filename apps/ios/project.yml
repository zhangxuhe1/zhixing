name: Zhixing
options:
  bundleIdPrefix: app.zhixing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: XXXXXXXXXX  # 加入 Apple Developer 后填 Team ID（真机/TestFlight 必需，模拟器不用）
  configs:
    debug:
      APP_API_BASE: http://localhost:8787
    release:
      APP_API_BASE: https://api.example.com
targets:
  Zhixing:
    type: application
    # iOS + Mac Catalyst 双目标（与 platform 键互斥）；测试 target 仍只跑 iOS 模拟器
    supportedDestinations: [iOS, macCatalyst]
    sources: [Zhixing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zhixing.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        # Catalyst 走 macosx SDK，条件精确命中：Mac 构建用无 SIWA 的 entitlements
        # （ad-hoc 签名带 applesignin 直接失败），iOS 构建不受影响
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Zhixing/ZhixingMac.entitlements
    info:
      path: Zhixing/Info.plist
      properties:
        CFBundleDisplayName: 知行
        # XcodeGen 会把版本号硬编码为 1.0，只加 MARKETING_VERSION 构建设置流不进产物
        # （探针已实证）——必须在此显式引用；dmg 产物命名依赖真实版本号
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        APIBase: $(APP_API_BASE)
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: 用于批量导入你的旅行照片，按地点点亮足迹地图。照片默认仅自己可见。
        NSLocationWhenInUseUsageDescription: 用于在留足迹时快速定位到你所在的地点。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Zhixing/Zhixing.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
  ZhixingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Zhixing
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Zhixing.app/Zhixing
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Zhixing:
    build:
      targets:
        Zhixing: all
    test:
      targets: [ZhixingTests]
