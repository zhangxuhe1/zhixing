services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zhixing
      POSTGRES_PASSWORD: zhixing
      POSTGRES_DB: zhixing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
volumes:
  pgdata:
