services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhixing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zhixing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhixing -d zhixing"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    # 仅绑宿主 127.0.0.1，供宿主层 Caddy 反代 s3.<域名>（S3 API 端口，仅本机可达）
    ports: ["127.0.0.1:9000:9000"]
    environment:
      # 默认 user=zhixing、password=S3_SECRET_KEY；如需自定义在 .env.production 设
      # MINIO_ROOT_USER/MINIO_ROOT_PASSWORD，api 侧 S3 凭据会自动跟随（见 api.environment）
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zhixing}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${S3_SECRET_KEY}}
    volumes:
      - minio-data:/data
    healthcheck:
      # minio/minio 镜像内置 mc；`mc ready local` 为官方推荐探活方式
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    # 仅绑宿主 127.0.0.1，供宿主层 Caddy 反代 api.<域名>（仅本机可达，不暴露公网）
    ports: ["127.0.0.1:8787:8787"]
    environment:
      # 触发 server.ts 的生产启动断言（src/prodGuard.ts）：弱密钥拒绝启动
      NODE_ENV: production
      DATABASE_URL: postgresql://zhixing:${POSTGRES_PASSWORD}@db:5432/zhixing
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://s3.${ZHIXING_DOMAIN}
      S3_BUCKET: zhixing
      # 与 minio 服务的 root 凭据同源，避免两边改一边导致 api 连不上 MinIO
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-zhixing}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-${S3_SECRET_KEY}}
      # /app-config 下发给 iOS 的分享落地页；不设时退回 dev 占位地址
      SHARE_LANDING_URL: ${SHARE_LANDING_URL:-http://localhost:8787/beta}
      # 本栈 api 恒在 Caddy 反代之后，必须开启（=1）Fastify 才会从 X-Forwarded-For
      # 解析真实客户端 IP——否则限流按代理 IP 计数，全站共用一个桶
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # 邮箱验证码登录发信：留空 SMTP_URL 则验证码只打印到 api 容器日志，不真实发信——
      # 生产要邮箱登录真正可用必须配置（格式与 SPF/DKIM 提醒见 deploy.md SMTP 小节）
      SMTP_URL: ${SMTP_URL:-}
      # 默认与 config.ts 兜底一致；改用自有发信地址在 .env.production 设 MAIL_FROM
      MAIL_FROM: ${MAIL_FROM:-知行 <noreply@example.com>}
    # 首启需等 db 就绪再跑 prisma migrate，否则迁移竞态失败（deploy.md 硬化清单）
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${ZHIXING_DOMAIN}
        # 高德选点 key（可选,构建期内联）:在 .env.production 配置;留空则表单退化手输坐标
        NEXT_PUBLIC_AMAP_KEY: ${NEXT_PUBLIC_AMAP_KEY:-}
        NEXT_PUBLIC_AMAP_SECURITY_CODE: ${NEXT_PUBLIC_AMAP_SECURITY_CODE:-}
    restart: unless-stopped
    # 仅绑宿主 127.0.0.1，供宿主层 Caddy 反代 admin.<域名>（容器内仍监听 3000）
    ports: ["127.0.0.1:8788:3000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    # 默认不启动：本机已有宿主层 Caddy 占 80/443 并反代现有服务，知行挂到宿主 Caddy 后面。
    # 仅在需要"容器自带边缘反代"的全新机器上，用 `docker compose --profile edge up` 显式启用。
    profiles: ["edge"]
    ports: ["80:80", "443:443"]
    environment:
      ZHIXING_DOMAIN: ${ZHIXING_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api, admin, minio]

volumes:
  pgdata:
  minio-data:
  caddy-data:
